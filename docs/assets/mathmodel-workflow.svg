<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">MathModel Run 证据驱动论文工作流</title>
  <desc id="desc">十个阶段从题面输入流向论文交付，每一步通过证据门禁，最终由独立审计确认。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#18304f" flood-opacity=".10"/></filter>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#075985"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d1fae5"/><stop offset="1" stop-color="#99f6e4"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4b86a6"/></marker>
    <style>
      text { font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; }
      .title { fill:#073b5c; font-size:25px; font-weight:750; }
      .sub { fill:#52758c; font-size:13px; }
      .band { fill:#fff; stroke:#c9e0ea; stroke-width:1.5; }
      .band-title { fill:#075985; font-size:14px; font-weight:750; }
      .band-note { fill:#6a8798; font-size:11px; }
      .stage { fill:#fff; stroke:#c9e0ea; stroke-width:1.5; }
      .stage-id { fill:#fff; font-family:'SF Mono',Menlo,Consolas,monospace; font-size:13px; font-weight:700; }
      .stage-name { fill:#123b58; font-size:14px; font-weight:750; }
      .stage-desc { fill:#668296; font-size:10px; }
      .gate { fill:#fff4cc; stroke:#f59e0b; stroke-width:1.5; }
      .gate-text { fill:#c26b00; font-family:'SF Mono',Menlo,Consolas,monospace; font-size:10px; font-weight:750; }
      .rail-label { fill:#5d7488; font-size:12px; font-weight:650; }
      .ready { fill:url(#navy); }
      .ready-title { fill:#fff; font-size:17px; font-weight:750; }
      .ready-text { fill:#d7f7f1; font-size:11px; }
      .ready-check { fill:#a9e5d4; font-size:13px; font-weight:700; }
    </style>
  </defs>

  <rect width="1600" height="520" fill="#f5fbfd"/>
  <rect x="42" y="22" width="1516" height="476" rx="20" fill="#eaf7fa" stroke="#c9e5ec"/>
  <text x="84" y="61" class="title">Evidence-driven paper workflow</text>
  <text x="84" y="84" class="sub">把题面推进成一篇可复现、可追溯、可交付的论文</text>
  <g transform="translate(1334 40)"><rect width="172" height="32" rx="16" fill="#c7f9e9"/><circle cx="22" cy="16" r="6" fill="#00a878"/><text x="38" y="21" fill="#087f5b" font-size="12" font-weight="750">DEFAULT-FAIL</text></g>

  <g filter="url(#shadow)">
    <rect x="84" y="108" width="1410" height="150" rx="14" class="band"/>
    <rect x="84" y="274" width="1410" height="150" rx="14" class="band"/>
  </g>
  <text x="112" y="135" class="band-title">01 · Understand</text><text x="112" y="153" class="band-note">先固定问题，再决定怎么解</text>
  <text x="112" y="301" class="band-title">02 · Prove &amp; deliver</text><text x="112" y="319" class="band-note">每一个结论都留下可复核证据</text>

  <!-- top row -->
  <g transform="translate(250 130)"><rect width="190" height="100" rx="10" class="stage"/><rect width="190" height="7" rx="4" fill="#06b6d4"/><circle cx="28" cy="32" r="17" fill="#06b6d4"/><text x="28" y="37" text-anchor="middle" class="stage-id">S0</text><text x="58" y="37" class="stage-name">输入预检</text><text x="22" y="65" class="stage-desc">题面 · 附件 · 环境</text><text x="22" y="83" class="stage-desc">固定快照与来源</text></g>
  <g transform="translate(480 130)"><rect width="190" height="100" rx="10" class="stage"/><rect width="190" height="7" rx="4" fill="#06b6d4"/><circle cx="28" cy="32" r="17" fill="#06b6d4"/><text x="28" y="37" text-anchor="middle" class="stage-id">S1</text><text x="58" y="37" class="stage-name">题意拆解</text><text x="22" y="65" class="stage-desc">子问题 · 约束 · 指标</text><text x="22" y="83" class="stage-desc">把问题变成验收标准</text></g>
  <g transform="translate(710 130)"><rect width="190" height="100" rx="10" class="stage"/><rect width="190" height="7" rx="4" fill="#06b6d4"/><circle cx="28" cy="32" r="17" fill="#06b6d4"/><text x="28" y="37" text-anchor="middle" class="stage-id">S2</text><text x="58" y="37" class="stage-name">模型选路</text><text x="22" y="65" class="stage-desc">baseline · primary</text><text x="22" y="83" class="stage-desc">fallback 与验证边界</text></g>
  <g transform="translate(940 130)"><rect width="190" height="100" rx="10" class="stage"/><rect width="190" height="7" rx="4" fill="#06b6d4"/><circle cx="28" cy="32" r="17" fill="#06b6d4"/><text x="28" y="37" text-anchor="middle" class="stage-id">S3</text><text x="58" y="37" class="stage-name">数据图表</text><text x="22" y="65" class="stage-desc">字段 · 单位 · 清洗</text><text x="22" y="83" class="stage-desc">泄漏检查与可视化计划</text></g>
  <g transform="translate(1170 130)"><rect width="190" height="100" rx="10" class="stage"/><rect width="190" height="7" rx="4" fill="#06b6d4"/><circle cx="28" cy="32" r="17" fill="#06b6d4"/><text x="28" y="37" text-anchor="middle" class="stage-id">S4</text><text x="58" y="37" class="stage-name">方法 PoC</text><text x="22" y="65" class="stage-desc">最小可运行证明</text><text x="22" y="83" class="stage-desc">先验证，再扩大实验</text></g>
  <g stroke="#4b86a6" stroke-width="2" marker-end="url(#arrow)"><line x1="440" y1="180" x2="474" y2="180"/><line x1="670" y1="180" x2="704" y2="180"/><line x1="900" y1="180" x2="934" y2="180"/><line x1="1130" y1="180" x2="1164" y2="180"/></g>

  <!-- bottom row -->
  <g transform="translate(250 318)"><rect width="190" height="100" rx="10" class="stage"/><rect width="190" height="7" rx="4" fill="#10b981"/><circle cx="28" cy="32" r="17" fill="#10b981"/><text x="28" y="39" text-anchor="middle" class="stage-id">S5</text><text x="58" y="37" class="stage-name">正式实验</text><text x="22" y="65" class="stage-desc">固定参数 · 种子 · 环境</text><text x="22" y="83" class="stage-desc">输出指标与图表</text></g>
  <g transform="translate(480 318)"><rect width="190" height="100" rx="10" class="stage"/><rect width="190" height="7" rx="4" fill="#10b981"/><circle cx="28" cy="32" r="17" fill="#10b981"/><text x="28" y="39" text-anchor="middle" class="stage-id">S6</text><text x="58" y="37" class="stage-name">结果冻结</text><text x="22" y="65" class="stage-desc">数字 · 来源 · 哈希</text><text x="22" y="83" class="stage-desc">论文只读冻结结果</text></g>
  <g transform="translate(710 318)"><rect width="190" height="100" rx="10" class="stage"/><rect width="190" height="7" rx="4" fill="#10b981"/><circle cx="28" cy="32" r="17" fill="#10b981"/><text x="28" y="39" text-anchor="middle" class="stage-id">S7</text><text x="58" y="37" class="stage-name">证据写作</text><text x="22" y="65" class="stage-desc">Workflow · claim map</text><text x="22" y="83" class="stage-desc">结论回链到证据</text></g>
  <g transform="translate(940 318)"><rect width="190" height="100" rx="10" class="stage"/><rect width="190" height="7" rx="4" fill="#10b981"/><circle cx="28" cy="32" r="17" fill="#10b981"/><text x="28" y="39" text-anchor="middle" class="stage-id">S8</text><text x="58" y="37" class="stage-name">渲染检查</text><text x="22" y="65" class="stage-desc">编译 · 逐页视觉检查</text><text x="22" y="83" class="stage-desc">模板与匿名性核验</text></g>
  <g transform="translate(1170 318)"><rect width="190" height="100" rx="10" class="stage"/><rect width="190" height="7" rx="4" fill="#10b981"/><circle cx="28" cy="32" r="17" fill="#10b981"/><text x="28" y="39" text-anchor="middle" class="stage-id">S9</text><text x="58" y="37" class="stage-name">独立审计</text><text x="22" y="65" class="stage-desc">复现运行 · 反查 claim</text><text x="22" y="83" class="stage-desc">审计后才可交付</text></g>
  <g stroke="#4b86a6" stroke-width="2" marker-end="url(#arrow)"><line x1="440" y1="368" x2="474" y2="368"/><line x1="670" y1="368" x2="704" y2="368"/><line x1="900" y1="368" x2="934" y2="368"/><line x1="1130" y1="368" x2="1164" y2="368"/></g>
  <path d="M1360 180 C1415 180 1415 330 1360 368" fill="none" stroke="#7b93aa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- gate rail -->
  <line x1="250" y1="450" x2="1360" y2="450" stroke="#c98922" stroke-width="3"/>
  <text x="112" y="455" class="rail-label">EVIDENCE GATES</text>
  <g class="gate-text" text-anchor="middle"><path class="gate" d="M300 438 312 450 300 462 288 450Z"/><text x="300" y="480">G1</text><path class="gate" d="M530 438 542 450 530 462 518 450Z"/><text x="530" y="480">G2</text><path class="gate" d="M760 438 772 450 760 462 748 450Z"/><text x="760" y="480">G3</text><path class="gate" d="M990 438 1002 450 990 462 978 450Z"/><text x="990" y="480">G4</text><path class="gate" d="M1220 438 1232 450 1220 462 1208 450Z"/><text x="1220" y="480">G5</text></g>
  <g transform="translate(1365 414)"><rect width="115" height="60" rx="10" class="ready"/><text x="57" y="27" text-anchor="middle" class="ready-title">READY</text><text x="57" y="47" text-anchor="middle" class="ready-text">10 gates + audit</text></g>
  <text x="800" y="500" text-anchor="middle" class="sub">门禁默认未通过 · 证据落盘后才翻门 · 上游变化会使下游证据失效</text>
</svg>
