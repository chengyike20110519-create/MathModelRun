<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">MathModel Run System Map</title>
  <desc id="desc">五段流水线：输入、智能体编排、证据契约、执行、交付，十道门禁与证据脊贯穿全程</desc>
  <defs>
    <style>
      .ink { fill:#17203a; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; }
      .muted { fill:#5f6b80; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; }
      .stage-num { fill:#7ea2ff; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; }
      .stage-title { fill:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; }
      .stage-sub { fill:#93a0c0; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; }
      .node-title { fill:#1b2438; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; }
      .node-sub { fill:#6b7690; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; }
      .gate-label { fill:#8a5a13; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; }
      .spine-label { fill:#aebadd; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; }
      .chip { fill:#1f2a44; stroke:#3d4d78; stroke-width:1.2; }
      .chip-text { fill:#d9e2ff; font-family:'SF Mono',Menlo,Consolas,monospace; }
      .nodecard { fill:#ffffff; stroke:#e2e8f2; stroke-width:1.2; }
      .stub { stroke:#c9d2e2; stroke-width:2; }
      .flow { stroke:#1f5ce8; stroke-width:3; fill:none; stroke-linecap:round; }
    </style>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#17203a" flood-opacity=".08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1f5ce8"/>
    </marker>
  </defs>

  <rect width="1600" height="800" fill="#fbfcfe"/>

  <!-- Header -->
  <text x="80" y="66" class="ink" font-size="34" font-weight="800">MathModel Run</text>
  <text x="1520" y="46" text-anchor="end" class="muted" font-size="13" letter-spacing="3">SYSTEM MAP / EVIDENCE-DRIVEN MODELING</text>
  <text x="1520" y="70" text-anchor="end" class="muted" font-size="13">五段流水线 · 十门禁 · 证据闭环</text>
  <text x="80" y="104" class="muted" font-size="15">把题面推进成有证据、可复现、可审计的论文交付系统</text>
  <rect x="80" y="120" width="64" height="4" fill="#1f5ce8"/>

  <!-- ===== Stage columns (x: 80, 372, 664, 956, 1248 ; centers 216,508,800,1092,1384) ===== -->

  <!-- 01 USER INPUT -->
  <g>
    <rect x="80" y="150" width="272" height="72" rx="12" fill="#17203a" filter="url(#soft)"/>
    <text x="104" y="184" class="stage-num" font-size="20" font-weight="800">01</text>
    <text x="142" y="182" class="stage-title" font-size="17" font-weight="750">输入</text>
    <text x="142" y="204" class="stage-sub" font-size="11" letter-spacing="1.5">USER INPUT</text>

    <rect x="80" y="238" width="272" height="64" rx="10" class="nodecard"/>
    <text x="98" y="264" class="node-title" font-size="14.5" font-weight="700">题面与附件</text>
    <text x="98" y="286" class="node-sub" font-size="11.5">文件、数据、来源、哈希</text>

    <rect x="80" y="314" width="272" height="64" rx="10" class="nodecard"/>
    <text x="98" y="340" class="node-title" font-size="14.5" font-weight="700">比赛约束</text>
    <text x="98" y="362" class="node-sub" font-size="11.5">要求、截止、页数与格式</text>

    <rect x="80" y="390" width="272" height="64" rx="10" class="nodecard"/>
    <text x="98" y="416" class="node-title" font-size="14.5" font-weight="700">输入快照</text>
    <text x="98" y="438" class="node-sub" font-size="11.5">S0 · 默认失败</text>
  </g>

  <!-- 02 AGENT ORCHESTRATION -->
  <g>
    <rect x="372" y="150" width="272" height="72" rx="12" fill="#17203a" filter="url(#soft)"/>
    <text x="396" y="184" class="stage-num" font-size="20" font-weight="800">02</text>
    <text x="434" y="182" class="stage-title" font-size="17" font-weight="750">智能体编排</text>
    <text x="434" y="204" class="stage-sub" font-size="11" letter-spacing="1.5">AGENT ORCHESTRATION</text>

    <rect x="372" y="238" width="272" height="64" rx="10" class="nodecard"/>
    <text x="390" y="264" class="node-title" font-size="14.5" font-weight="700">分析器</text>
    <text x="390" y="286" class="node-sub" font-size="11.5">S1 题意拆解</text>

    <rect x="372" y="314" width="272" height="64" rx="10" class="nodecard"/>
    <text x="390" y="340" class="node-title" font-size="14.5" font-weight="700">建模器</text>
    <text x="390" y="362" class="node-sub" font-size="11.5">S2 选路 · S3 数据</text>

    <rect x="372" y="390" width="272" height="64" rx="10" class="nodecard"/>
    <text x="390" y="416" class="node-title" font-size="14.5" font-weight="700">实验器</text>
    <text x="390" y="438" class="node-sub" font-size="11.5">S4 PoC · S5 正式实验</text>

    <rect x="372" y="466" width="272" height="64" rx="10" class="nodecard"/>
    <text x="390" y="492" class="node-title" font-size="14.5" font-weight="700">交付器</text>
    <text x="390" y="514" class="node-sub" font-size="11.5">S7 写作 · S8 渲染</text>
  </g>

  <!-- 03 EVIDENCE CONTRACTS -->
  <g>
    <rect x="664" y="150" width="272" height="72" rx="12" fill="#17203a" filter="url(#soft)"/>
    <text x="688" y="184" class="stage-num" font-size="20" font-weight="800">03</text>
    <text x="726" y="182" class="stage-title" font-size="17" font-weight="750">证据契约</text>
    <text x="726" y="204" class="stage-sub" font-size="11" letter-spacing="1.5">EVIDENCE CONTRACTS</text>

    <rect x="664" y="238" width="272" height="64" rx="10" class="nodecard"/>
    <text x="682" y="264" class="node-title" font-size="14.5" font-weight="700" font-family="'SF Mono',Menlo,Consolas,monospace">state.json</text>
    <text x="682" y="286" class="node-sub" font-size="11.5">阶段状态 · 十门禁</text>

    <rect x="664" y="314" width="272" height="64" rx="10" class="nodecard"/>
    <text x="682" y="340" class="node-title" font-size="14.5" font-weight="700" font-family="'SF Mono',Menlo,Consolas,monospace">run_manifest</text>
    <text x="682" y="362" class="node-sub" font-size="11.5">运行 · 命令 · 环境 · 哈希</text>

    <rect x="664" y="390" width="272" height="64" rx="10" class="nodecard"/>
    <text x="682" y="416" class="node-title" font-size="14.5" font-weight="700" font-family="'SF Mono',Menlo,Consolas,monospace">frozen_numbers</text>
    <text x="682" y="438" class="node-sub" font-size="11.5">论文数字的唯一来源</text>

    <rect x="664" y="466" width="272" height="64" rx="10" class="nodecard"/>
    <text x="682" y="492" class="node-title" font-size="14.5" font-weight="700" font-family="'SF Mono',Menlo,Consolas,monospace">evidence_map</text>
    <text x="682" y="514" class="node-sub" font-size="11.5">claim → evidence → figure</text>
  </g>

  <!-- 04 EXECUTION LAYER -->
  <g>
    <rect x="956" y="150" width="272" height="72" rx="12" fill="#17203a" filter="url(#soft)"/>
    <text x="980" y="184" class="stage-num" font-size="20" font-weight="800">04</text>
    <text x="1018" y="182" class="stage-title" font-size="17" font-weight="750">执行与审查</text>
    <text x="1018" y="204" class="stage-sub" font-size="11" letter-spacing="1.5">EXECUTION LAYER</text>

    <rect x="956" y="238" width="272" height="64" rx="10" class="nodecard"/>
    <text x="974" y="264" class="node-title" font-size="14.5" font-weight="700">数据与代码</text>
    <text x="974" y="286" class="node-sub" font-size="11.5">清洗 · PoC · 正式运行</text>

    <rect x="956" y="314" width="272" height="64" rx="10" class="nodecard"/>
    <text x="974" y="340" class="node-title" font-size="14.5" font-weight="700">图表与渲染</text>
    <text x="974" y="362" class="node-sub" font-size="11.5">图 · 表 · PDF · 逐页检查</text>

    <rect x="956" y="390" width="272" height="64" rx="10" class="nodecard"/>
    <text x="974" y="416" class="node-title" font-size="14.5" font-weight="700">机械审计</text>
    <text x="974" y="438" class="node-sub" font-size="11.5">结构 · 门禁 · 溯源</text>

    <rect x="956" y="466" width="272" height="64" rx="10" class="nodecard"/>
    <text x="974" y="492" class="node-title" font-size="14.5" font-weight="700">独立复核</text>
    <text x="974" y="514" class="node-sub" font-size="11.5">评分 · 硬错误 · 最终意见</text>
  </g>

  <!-- 05 DELIVERY -->
  <g>
    <rect x="1248" y="150" width="272" height="72" rx="12" fill="#1f5ce8" filter="url(#soft)"/>
    <text x="1272" y="184" fill="#bcd0ff" font-size="20" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">05</text>
    <text x="1310" y="182" class="stage-title" font-size="17" font-weight="750">交付</text>
    <text x="1310" y="204" fill="#bcd0ff" font-size="11" letter-spacing="1.5" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">DELIVERY</text>

    <rect x="1248" y="238" width="272" height="64" rx="10" class="nodecard"/>
    <text x="1266" y="264" class="node-title" font-size="14.5" font-weight="700">可复现结果</text>
    <text x="1266" y="286" class="node-sub" font-size="11.5">run + logs + frozen values</text>

    <rect x="1248" y="314" width="272" height="64" rx="10" class="nodecard"/>
    <text x="1266" y="340" class="node-title" font-size="14.5" font-weight="700">可追溯论文</text>
    <text x="1266" y="362" class="node-sub" font-size="11.5">claims mapped to evidence</text>

    <rect x="1248" y="390" width="272" height="64" rx="10" class="nodecard"/>
    <text x="1266" y="416" class="node-title" font-size="14.5" font-weight="700">可提交 PDF</text>
    <text x="1266" y="438" class="node-sub" font-size="11.5">rendered and checked</text>

    <rect x="1248" y="466" width="272" height="64" rx="10" fill="#17203a" stroke="#17203a" stroke-width="1.2"/>
    <text x="1266" y="492" fill="#ffffff" font-size="14.5" font-weight="750" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">READY / AUDITED</text>
    <text x="1266" y="514" fill="#93a0c0" font-size="11.5" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">十门禁 + 最终验收</text>
  </g>

  <!-- ===== Flow spine with ten gates ===== -->
  <line x1="216" y1="464" x2="216" y2="576" class="stub"/>
  <line x1="508" y1="540" x2="508" y2="576" class="stub"/>
  <line x1="800" y1="540" x2="800" y2="576" class="stub"/>
  <line x1="1092" y1="540" x2="1092" y2="576" class="stub"/>
  <line x1="1384" y1="540" x2="1384" y2="576" class="stub"/>
  <path d="M216 576H1376" class="flow" marker-end="url(#arrow)"/>

  <g>
    <rect x="316" y="569" width="14" height="14" transform="rotate(45 323 576)" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <rect x="422" y="569" width="14" height="14" transform="rotate(45 429 576)" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <rect x="528" y="569" width="14" height="14" transform="rotate(45 535 576)" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <rect x="634" y="569" width="14" height="14" transform="rotate(45 641 576)" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <rect x="740" y="569" width="14" height="14" transform="rotate(45 747 576)" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <rect x="846" y="569" width="14" height="14" transform="rotate(45 853 576)" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <rect x="952" y="569" width="14" height="14" transform="rotate(45 959 576)" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <rect x="1058" y="569" width="14" height="14" transform="rotate(45 1065 576)" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <rect x="1164" y="569" width="14" height="14" transform="rotate(45 1171 576)" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <rect x="1270" y="569" width="14" height="14" transform="rotate(45 1277 576)" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <text x="323" y="602" text-anchor="middle" class="gate-label" font-size="10.5" font-weight="700">G1</text>
    <text x="429" y="602" text-anchor="middle" class="gate-label" font-size="10.5" font-weight="700">G2</text>
    <text x="535" y="602" text-anchor="middle" class="gate-label" font-size="10.5" font-weight="700">G3</text>
    <text x="641" y="602" text-anchor="middle" class="gate-label" font-size="10.5" font-weight="700">G4</text>
    <text x="747" y="602" text-anchor="middle" class="gate-label" font-size="10.5" font-weight="700">G5</text>
    <text x="853" y="602" text-anchor="middle" class="gate-label" font-size="10.5" font-weight="700">G6</text>
    <text x="959" y="602" text-anchor="middle" class="gate-label" font-size="10.5" font-weight="700">G7</text>
    <text x="1065" y="602" text-anchor="middle" class="gate-label" font-size="10.5" font-weight="700">G8</text>
    <text x="1171" y="602" text-anchor="middle" class="gate-label" font-size="10.5" font-weight="700">G9</text>
    <text x="1277" y="602" text-anchor="middle" class="gate-label" font-size="10.5" font-weight="700">G10</text>
    <text x="800" y="630" text-anchor="middle" class="muted" font-size="12.5">十道门禁 · 默认 FAIL，逐门通过才能继续推进</text>
  </g>

  <!-- ===== Evidence spine ===== -->
  <rect x="80" y="664" width="1440" height="92" rx="14" fill="#17203a" filter="url(#soft)"/>
  <text x="116" y="700" class="spine-label" font-size="13" font-weight="700" letter-spacing="3">EVIDENCE SPINE</text>
  <text x="116" y="727" fill="#8e9bc0" font-size="12.5" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">每一个 claim 都必须能回溯到证据</text>

  <rect x="880" y="690" width="150" height="40" rx="9" class="chip"/>
  <text x="955" y="715" text-anchor="middle" class="chip-text" font-size="13">state.json</text>
  <rect x="1042" y="690" width="166" height="40" rx="9" class="chip"/>
  <text x="1125" y="715" text-anchor="middle" class="chip-text" font-size="13">run_manifest</text>
  <rect x="1220" y="690" width="176" height="40" rx="9" class="chip"/>
  <text x="1308" y="715" text-anchor="middle" class="chip-text" font-size="13">frozen_numbers</text>
  <rect x="1408" y="690" width="74" height="40" rx="9" class="chip"/>
  <text x="1445" y="715" text-anchor="middle" class="chip-text" font-size="13">evidence_map</text>
</svg>
